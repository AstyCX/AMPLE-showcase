<script type="module">
  import { start } from './src/main.js';

  const hasGL = (() => {
    try {
      return Boolean(document.createElement('canvas').getContext('webgl2'));
    } catch {
      return false;
    }
  })();
  const sceneModule = hasGL ? import('./src/amp/scene.js') : null;
  const audioModule = import('./src/audio.js');
  sceneModule?.catch(() => {});
  audioModule.catch(() => {});

  start({
    root: document.getElementById('app'),
    createAmpScene: sceneModule && (async (opts) => (await sceneModule).createAmpScene(opts)),
    createAudioEngine: async (opts) => (await audioModule).createAudioEngine(opts),
  });
</script>
